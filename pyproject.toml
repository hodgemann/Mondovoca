[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mondovoca"
dynamic = ["version"]
description = "A local voice studio for the speech models on your own computer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
mondovoca = "mondovoca.server:main"

[tool.setuptools.dynamic]
version = {attr = "mondovoca.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mondovoca = ["static/*", "NOTICE.md"]
